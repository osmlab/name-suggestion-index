name: build and commit

on:
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

env:
  FORCE_COLOR: 2

jobs:
  build-nsi:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - run: bun install
    - run: bun run all
    - name: Open PR
      uses: peter-evans/create-pull-request@v8
      with:
        commit-message: 'bun run all'
        title: 'Build data'
        branch: action/build-daily
